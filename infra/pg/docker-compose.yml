services:
  postgres:
    image: postgres:16-alpine
    container_name: studio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio_db
    networks:
      - studio-bot-network
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U studio -d studio_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: studio_adminer
    restart: unless-stopped
    networks:
      - studio-bot-network
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

networks:
  studio-bot-network:
    external: true
    name: studio-bot-network
volumes:
  postgres_data: